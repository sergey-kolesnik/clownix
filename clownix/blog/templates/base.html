{% load static %}
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>{% block title %}{{ page_title|default:"Clownix" }} — Clownix Linux Reference{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/normalize.css' %}" />
    <link rel="stylesheet" href="{% static 'css/main.css' %}" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <a class="sidebar__logo" href="{% url 'blog:home' %}">
          <h1 class="sidebar__title">
            Clownix
          </h1>
        </a>
        <nav class="sidebar-nav" aria-label="Темы">
          <h2 class="sidebar-nav__title">Темы</h2>
          <ul class="sidebar-nav__list">
            <li class="sidebar-nav__item {% if not request.resolver_match.kwargs.slug %}sidebar-nav__item--active{% endif %}">
              <a href="{% url 'blog:home' %}">Все записи</a>
            </li>
            {% for cat in sidebar_categories %}
            <li class="sidebar-nav__item {% if request.resolver_match.kwargs.slug == cat.slug %}sidebar-nav__item--active{% endif %}">
              <a href="{{ cat.get_absolute_url }}">{{ cat.name }}</a>
            </li>
            {% endfor %}
          </ul>
        </nav>
      </aside>

      <main class="main container">
        <header class="topbar">
          <form class="search" action="{% url 'blog:search' %}" method="get" role="search">
            <input
              class="search__input"
              type="search"
              name="q"
              value="{{ request.GET.q|default:'' }}"
              placeholder="Поиск по командам или заголовку…"
              aria-label="Поиск"
            />
            <button class="search__btn" type="submit">Найти</button>
          </form>
        </header>

        <div class="content">
          {% block content %}{% endblock %}
        </div>
      </main>
    </div>
  </body>
</html>
