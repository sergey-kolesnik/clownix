# 1. Редирект с HTTP на HTTPS
server {
    listen 80;
    server_name clownix.ru www.clownix.ru;
    return 301 https://$host$request_uri;
}

# 2. Основной сервер HTTPS
server {
    listen 443 ssl http2;
    server_name clownix.ru www.clownix.ru;

    ssl_certificate     /etc/letsencrypt/live/clownix.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clownix.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        # В вашем compose сервис называется 'web', порт 8000
        proxy_pass http://web:8000; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Если у вас есть статика и медиа, добавьте их сюда:
    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }
}
